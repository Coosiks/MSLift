services:
  postgres:
    image: postgres:16-alpine
    container_name: mslift-postgres
    environment:
      POSTGRES_DB: mslift
      POSTGRES_USER: mslift
      POSTGRES_PASSWORD: mslift_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: