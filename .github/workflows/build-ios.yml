name: Build iOS App (IPA & Archive)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Build & Archive iOS App with Xcode
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MSLift.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive | xcbeautify || xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MSLift.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package iOS IPA & Zip Archive
        run: |
          mkdir -p final-ios/Payload
          cp -r frontend/ios/App/build/MSLift.xcarchive/Products/Applications/App.app final-ios/Payload/
          cd final-ios
          zip -qr MSLift-iOS.ipa Payload
          cp MSLift-iOS.ipa MSLift-unsigned.ipa
          cd ..
          
          cd frontend/ios/App/build
          zip -qr ../../../../final-ios/MSLift-iOS.xcarchive.zip MSLift.xcarchive
          cd ../../../..

          echo "### Generated iOS Artifacts:"
          ls -lh final-ios/

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MSLift-iOS-Bundle
          path: final-ios/*
          if-no-files-found: error

      - name: Attach iOS Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0-offline final-ios/MSLift-iOS.ipa final-ios/MSLift-iOS.xcarchive.zip --clobber || \
          gh release create v1.0.0-offline final-ios/MSLift-iOS.ipa final-ios/MSLift-iOS.xcarchive.zip \
            --title "MSLift Mobile v1.0.0 (Offline Gym App: Android & iOS)" \
            --notes "Полнофункциональное мобильное приложение MSLift для тренировок в зале оффлайн. Доступны нативный Android APK и iOS IPA." || true
