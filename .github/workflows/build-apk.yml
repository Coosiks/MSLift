name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Bundle
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: |
          chmod +x android/gradlew
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          npx @capacitor/cli sync android 2>&1 | tee /tmp/sync.log || {
            echo "### Sync Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/sync.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build Debug APK with Gradle
        working-directory: frontend/android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log || BUILD_STATUS=$?
          echo "## Gradle Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 /tmp/gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${BUILD_STATUS:-0}" -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $BUILD_STATUS"
            grep -A 20 "What went wrong" /tmp/gradle_build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            grep -A 10 "Caused by:" /tmp/gradle_build.log | head -n 25 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit $BUILD_STATUS
          fi

      - name: Upload Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: /tmp/gradle_build.log



      - name: Locate and Package APK
        run: |
          echo "### Finding generated APK files:"
          find . -name "*.apk"
          mkdir -p final-apk
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found after Gradle build!"
            exit 1
          fi
          cp "$APK_FILE" final-apk/MSLift-debug.apk
          ls -lh final-apk/MSLift-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSLift-Debug-APK
          path: final-apk/MSLift-debug.apk
          if-no-files-found: error

      - name: Publish Direct Download Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-offline --yes || true
          git tag -d v1.0.0-offline || true
          git push origin :refs/tags/v1.0.0-offline || true
          gh release create v1.0.0-offline final-apk/MSLift-debug.apk \
            --title "MSLift Mobile v1.0.0 (Offline Gym APK)" \
            --notes "Полнофункциональный standalone Android APK для тренировок в зале оффлайн. Включает 40+ программ (1020 тренировок), таймер отдыха с пуш-уведомлениями и виброоткликом, ведение дневника без интернета." || true

